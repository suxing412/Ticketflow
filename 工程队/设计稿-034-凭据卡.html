<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>设计稿-034 凭据卡</title><style>
:root{--bg:#0D1117;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.07);--ink:#E8EAF0;--sub:#76808F;--ok:#2FD6A0;--warn:#E8B93E;--bad:#FF5D57;--unk:#6B7380;--chip:rgba(255,255,255,.08)}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI",system-ui;margin:0;padding:40px;display:flex;justify-content:center}
.card{width:640px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
h3{margin:0 0 2px;font-size:15px}
.sub{color:var(--sub);font-size:12px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ok{background:var(--ok)} .unk{background:var(--unk)}
.name{font-weight:600;width:86px;flex:none}
.kind{font-size:11px;color:var(--sub);background:var(--chip);border-radius:99px;padding:1px 8px;flex:none}
.stat{color:var(--ink);opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{color:var(--sub)}
button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--sub)}
.foot{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line);margin-top:2px}
.foot .grow{flex:1}
.legend{color:var(--sub);font-size:11px;cursor:default}
.legend:hover .tip{display:block}
.tip{display:none;position:absolute;transform:translateY(-64px);background:#1A2029;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip b{font-weight:600}
</style></head><body>
<div class="card">
  <h3>凭据</h3>
  <div class="sub">订阅登录归各 CLI 保管 · API key 由监制台加密托管，绝不入配置文件</div>

  <div class="row">
    <span class="dot ok" title="可用"></span>
    <span class="name">claude</span><span class="kind">订阅</span>
    <span class="stat">token 有效至 21:05</span>
    <button>重新登录</button>
  </div>

  <div class="row">
    <span class="dot ok" title="可用"></span>
    <span class="name">codex</span><span class="kind">订阅</span>
    <span class="stat">登录正常 <small>· 周额度已用 0%</small></span>
    <button>重新登录</button>
  </div>

  <div class="row">
    <span class="dot ok" title="可用"></span>
    <span class="name">deepseek</span><span class="kind">key·托管</span>
    <span class="stat">●●●●d7e4 <small>· api.deepseek.com · deepseek-v4-pro · 08-09 迁入</small></span>
    <button>更换</button>
    <button>删除</button>
  </div>

  <div class="foot">
    <button>＋ 添加 key</button>
    <button>重新检测</button>
    <span class="grow"></span>
    <span class="legend">● 状态图例<span class="tip"><b style="color:var(--ok)">●</b> 可用　<b style="color:var(--warn)">●</b> 受限·自愈中　<b style="color:var(--bad)">●</b> 失效·需重登　<b style="color:var(--unk)">●</b> 未知·探不到</span></span>
  </div>
</div>
</body></html>
